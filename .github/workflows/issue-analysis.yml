# Issue Analysis
#
# Runs the repo's /is prompt against an issue and posts the agent's analysis as
# a comment. Triggers on:
#   - adding the `pi-analyze` label to an issue, or
#   - commenting `@pia` on an issue.
# Only issues created by the repository owner are analyzed. Text after `@pia`
# is forwarded to the agent as extra instructions. Pull request comments are
# ignored.
#
# All provider configuration comes from environment variables through the
# `.pi/extensions/ci.ts` extension:
#   - OPENAI_BASE_URL points the `openai` provider at an OpenAI-compatible
#     gateway.
#   - OPENAI_API_KEY is read by the provider itself.
# The GitHub MCP server used by /is is written into the agent directory by the
# `Configure GitHub MCP` step below.
#
# Setup:
#   1. Create the `pi-analyze` label.
#   2. Create a `pi-analyze` GitHub environment with an `OPENAI_API_KEY` secret.
#   3. Set the optional `OPENAI_BASE_URL` repository variable when the gateway
#      is not api.openai.com. The model is fixed to openai/gpt-6.1-sol with
#      xhigh thinking.

name: Issue Analysis

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: issue-analysis-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  analyze:
    if: |
      github.event.issue.user.login == github.repository_owner &&
      (
        (github.event_name == 'issues' &&
         github.event.action == 'labeled' &&
         github.event.label.name == 'pi-analyze') ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request == null &&
         contains(github.event.comment.body, '@pia'))
      )
    runs-on: ubuntu-latest
    environment: pi-analyze
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      PI_MODEL: openai/gpt-6.1-sol
      PI_THINKING: xhigh
      PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install pi
        run: npm install --global @earendil-works/pi-coding-agent@1.3.0

      - name: Configure GitHub MCP
        run: |
          set -uo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          cat > "$PI_CODING_AGENT_DIR/mcp.json" <<'JSON'
          {
            "mcpServers": {
              "github": {
                "url": "https://api.githubcopilot.com/mcp/",
                "headers": { "Authorization": "Bearer ${GITHUB_TOKEN}" },
                "description": "GitHub API access used by the /is issue-analysis prompt.",
                "toolExposure": { "get_me": "direct", "issue_read": "direct" }
              }
            }
          }
          JSON

      - name: Run pi /is
        env:
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -uo pipefail
          out_dir="$RUNNER_TEMP/pi-out"
          mkdir -p "$out_dir/session"

          prompt="/is ${ISSUE_URL}"
          extra_instructions="$(printf '%s' "${COMMENT_BODY:-}" | sed -E 's/@pia//I')"
          extra_instructions="$(printf '%s' "$extra_instructions" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          if [ -n "$extra_instructions" ]; then
            prompt="${prompt}"$'\n\nAdditional instructions from the @pia comment:\n'"${extra_instructions}"
          fi

          set +e
          pi -p --approve \
            --session-dir "$out_dir/session" \
            --model "$PI_MODEL" \
            --thinking "$PI_THINKING" \
            "$prompt" 2>&1 | tee "$out_dir/output.md"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::error::pi /is failed with exit code $status"
            exit "$status"
          fi

      - name: Export session
        if: always()
        run: |
          set -uo pipefail
          out_dir="$RUNNER_TEMP/pi-out"
          session_file="$(find "$out_dir/session" -type f -name '*.jsonl' | head -n 1)"
          if [ -z "$session_file" ]; then
            echo "No session file found; skipping export"
            exit 0
          fi
          cp "$session_file" "$out_dir/session.jsonl"
          pi --no-extensions --export "$out_dir/session.jsonl" "$out_dir/session.html" \
            || echo "Session export failed (non-fatal)"

      - name: Upload session artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-analysis-session
          path: ${{ runner.temp }}/pi-out
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: analyze
    if: always() && needs.analyze.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download session artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: pi-analysis-session
          path: pi-out

      - name: Post result comment
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const outDir = 'pi-out';

            function readText(file) {
              try {
                return fs.readFileSync(file, 'utf8').trim();
              } catch {
                return '';
              }
            }

            function extractLastAssistantMessage(sessionPath) {
              const raw = readText(sessionPath);
              if (!raw) return '';
              let last = '';
              for (const line of raw.split(/\r?\n/)) {
                if (!line.trim()) continue;
                let entry;
                try {
                  entry = JSON.parse(line);
                } catch {
                  continue;
                }
                if (entry.type !== 'message' || entry.message?.role !== 'assistant') continue;
                const content = entry.message.content;
                const parts = [];
                if (typeof content === 'string') {
                  parts.push(content);
                } else if (Array.isArray(content)) {
                  for (const block of content) {
                    if (block?.type === 'text' && typeof block.text === 'string') {
                      parts.push(block.text);
                    }
                  }
                }
                const text = parts.join('\n\n').trim();
                if (text) last = text;
              }
              return last;
            }

            let summary = extractLastAssistantMessage(path.join(outDir, 'session.jsonl'));
            if (!summary) summary = readText(path.join(outDir, 'output.md'));

            const result = process.env.ANALYZE_RESULT;
            const maxLength = 55000;
            let body;
            if (result === 'success' && summary) {
              const truncated =
                summary.length > maxLength ? `${summary.slice(0, maxLength)}\n\n_[truncated]_` : summary;
              body = [
                'Pi issue analysis finished.',
                '',
                '<details>',
                '<summary>Agent analysis</summary>',
                '',
                truncated,
                '',
                '</details>',
              ].join('\n');
            } else {
              body = [
                `Pi issue analysis did not complete (analyze job: ${result}).`,
                '',
                `Run: ${process.env.RUN_URL}`,
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Remove trigger label
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'pi-analyze',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
